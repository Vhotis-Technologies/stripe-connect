[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stripe-connect"
version = "0.1.0"
description = "App-agnostic Stripe Connect engine: Express accounts, onboarding, readiness, destination charges, and webhooks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "stripe-connect contributors" },
]
keywords = ["stripe", "connect", "marketplace", "payments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "stripe>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Repository = "https://github.com/example/stripe-connect"

[tool.hatch.build.targets.wheel]
packages = ["python/stripe_connect"]

[tool.hatch.build.targets.wheel.sources]
"python" = ""

[tool.hatch.build.targets.sdist]
include = [
    "/python/stripe_connect",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["python", "tests"]
